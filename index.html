<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LimiX-2 传播监测</title>
  <script src="./data.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel2: #182338;
      --text: #e8eefc;
      --muted: #9aa8c7;
      --line: #24314d;
      --accent: #5b8cff;
      --good: #3dd68c;
      --warn: #f5a524;
      --bad: #f31260;
      --seed: #7c5cff;
      --org: #2ec4b6;
      --anchor: #8aa0c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px 24px 8px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: 0.02em; }
    .sub { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.warn { color: var(--warn); border-color: #5a4218; background: #2a2110; }
    .badge.seed { color: #cbb8ff; border-color: #3d2f7a; }
    .badge.org { color: #9ff0e6; border-color: #1d5c55; }
    .tabs {
      display: flex;
      gap: 6px;
      max-width: 1200px;
      margin: 12px auto 0;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      appearance: none;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
      box-shadow: inset 0 -1px 0 var(--panel);
      position: relative;
      top: 1px;
    }
    main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, #0f1728 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .card .label { color: var(--muted); font-size: 0.8rem; }
    .card .value { font-size: 1.55rem; font-weight: 700; margin-top: 6px; }
    .card .delta { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }
    .delta.up { color: var(--good); }
    .delta.down { color: var(--bad); }
    .delta.flat { color: var(--muted); }
    .warn-box {
      background: #2a2110;
      border: 1px solid #5a4218;
      color: #ffd89a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.9rem;
      line-height: 1.55;
      margin: 0 0 18px;
    }
    .section-title {
      margin: 22px 0 10px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title:first-child { margin-top: 0; }
    .hint { color: var(--muted); font-size: 0.85rem; font-weight: 400; margin-left: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.seed { background: var(--seed); }
    .dot.org { background: var(--org); }
    .dot.anchor { background: var(--anchor); }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
    .chart-card { min-height: 260px; }
    canvas { width: 100%; height: 220px; display: block; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      min-width: 720px;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.url a {
      display: inline-block;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); padding: 12px 0; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .tag.seed { color: #cbb8ff; border-color: #3d2f7a; background: #1a1433; }
    .tag.org { color: #9ff0e6; border-color: #1d5c55; background: #0f2a28; }
    .tag.anchor { color: #c9d4ef; border-color: #3a4a66; background: #182338; }
    .tag.status-online { color: var(--good); border-color: #1d5c3a; }
    .tag.status-fail { color: var(--bad); border-color: #5a1d35; }
    footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .notes li { margin: 4px 0; }
    .mono { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>LimiX-2 传播监测</h1>
    <div class="sub">
      跟踪 <strong>LimiX-2（400M）</strong> 开源后的小时级传播：区分<strong>投放</strong>与<strong>自发</strong>。
      请勿与旧版 <strong>LimiX-2M</strong>（约 2M 参数）混淆。
    </div>
    <div class="badges" id="badges"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="主视图">
    <button class="tab-btn active" role="tab" aria-selected="true" data-tab="board">看板</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="media">媒体列表</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="hourly">小时存档</button>
  </nav>

  <main>
    <section id="tab-board" class="tab-panel active" role="tabpanel">
      <div class="warn-box" id="warnings"></div>
      <div class="grid" id="metrics"></div>

      <div class="section-title">小时级趋势</div>
      <div class="charts">
        <div class="card chart-card">
          <div class="label">GitHub Stars / Forks（整仓累计）</div>
          <canvas id="chartGh" width="600" height="220"></canvas>
        </div>
        <div class="card chart-card">
          <div class="label">Hugging Face Likes / Downloads</div>
          <canvas id="chartHf" width="600" height="220"></canvas>
        </div>
        <div class="card chart-card">
          <div class="label">投放数 / 自发媒体数</div>
          <canvas id="chartCounts" width="600" height="220"></canvas>
        </div>
        <div class="card chart-card">
          <div class="label">本小时新增自发</div>
          <canvas id="chartNew" width="600" height="220"></canvas>
        </div>
      </div>

      <div class="section-title">本小时备注</div>
      <div class="card"><ul class="notes" id="notes"></ul></div>
    </section>

    <section id="tab-media" class="tab-panel" role="tabpanel" hidden>
      <div class="section-title"><span class="dot org"></span> 媒体稿 <span class="hint" id="mediaCountHint"></span></div>
      <div class="card"><div class="table-wrap" id="tableMedia"></div></div>

      <div class="section-title"><span class="dot anchor"></span> 官方锚点 <span class="hint">GitHub / Hugging Face / arXiv</span></div>
      <div class="card"><div class="table-wrap" id="tableAnchors"></div></div>
    </section>

    <section id="tab-hourly" class="tab-panel" role="tabpanel" hidden>
      <div class="section-title">小时存档 <span class="hint" id="hourlyHint"></span></div>
      <div class="card"><div class="table-wrap" id="tableHourly"></div></div>
    </section>
  </main>
  <footer id="footer"></footer>

  <script>
    const DATA = window.LIMIX2_DATA || null;
    const ANCHOR_CHANNELS = new Set(["github", "hugging face", "huggingface", "hf", "arxiv"]);
    const ANCHOR_HOSTS = ["github.com", "huggingface.co", "arxiv.org"];

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmt(v) {
      if (v === null || v === undefined || v === "") return "—";
      if (typeof v === "number") return v.toLocaleString("zh-CN");
      return String(v);
    }

    function fmtTime(v) {
      if (!v) return "—";
      const s = String(v);
      // UTC ISO -> show as-is with Z, Shanghai already space-separated
      if (s.includes("T") && s.endsWith("Z")) {
        try {
          const d = new Date(s);
          if (!Number.isNaN(d.getTime())) {
            const sh = new Date(d.getTime() + 8 * 3600 * 1000);
            const p = (n) => String(n).padStart(2, "0");
            return `${sh.getUTCFullYear()}-${p(sh.getUTCMonth() + 1)}-${p(sh.getUTCDate())} ${p(sh.getUTCHours())}:${p(sh.getUTCMinutes())}`;
          }
        } catch (_) {}
      }
      return s;
    }

    function deltaHtml(dv) {
      if (dv === null || dv === undefined) return '<span class="delta flat">较上小时 —</span>';
      const cls = dv > 0 ? "up" : dv < 0 ? "down" : "flat";
      const sign = dv > 0 ? "+" : "";
      return `<span class="delta ${cls}">较上小时 ${sign}${dv}</span>`;
    }

    function metricCard(label, value, delta) {
      return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${fmt(value)}</div>${deltaHtml(delta)}</div>`;
    }

    function isAnchorItem(it) {
      if (!it) return false;
      if (it.is_anchor === true) return true;
      const ch = String(it.channel || "").trim().toLowerCase();
      if (ANCHOR_CHANNELS.has(ch)) return true;
      const url = String(it.url || "").toLowerCase();
      return ANCHOR_HOSTS.some((h) => url.includes(h));
    }

    function classificationOf(it) {
      const t = String(it.source_type || it.classification || "").toLowerCase();
      if (t === "seeded" || t === "投放") return "seeded";
      if (t === "organic" || t === "自发") return "organic";
      // fallback by list membership handled by caller
      return it._cls || "organic";
    }

    function classTag(cls) {
      if (cls === "seeded") return '<span class="tag seed">投放</span>';
      return '<span class="tag org">自发</span>';
    }

    function statusTag(st) {
      const s = String(st || "—");
      if (s === "online") return `<span class="tag status-online">${esc(s)}</span>`;
      if (s === "fetch_failed" || s === "missing_url") return `<span class="tag status-fail">${esc(s)}</span>`;
      return `<span class="tag">${esc(s)}</span>`;
    }

    function publishOf(it) {
      return it.publish_time || it.published_hint || it.publish_time_note || null;
    }

    function drawLineChart(canvas, series, colors) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0f1728";
      ctx.fillRect(0, 0, w, h);

      const pad = { l: 44, r: 12, t: 16, b: 28 };
      const labels = (series[0] && series[0].xs) || [];
      let max = 1, min = 0;
      series.forEach(s => s.ys.forEach(v => {
        if (v == null || Number.isNaN(v)) return;
        max = Math.max(max, v);
        min = Math.min(min, v);
      }));
      if (max === min) max = min + 1;

      ctx.strokeStyle = "#24314d";
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const y = pad.t + (h - pad.t - pad.b) * i / 3;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
        const val = max - (max - min) * i / 3;
        ctx.fillStyle = "#9aa8c7";
        ctx.font = "11px sans-serif";
        ctx.fillText(String(Math.round(val)), 6, y + 4);
      }

      function xAt(i, n) {
        if (n <= 1) return pad.l + (w - pad.l - pad.r) / 2;
        return pad.l + (w - pad.l - pad.r) * i / (n - 1);
      }
      function yAt(v) {
        return pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min));
      }

      series.forEach((s, si) => {
        const pts = [];
        for (let i = 0; i < s.ys.length; i++) {
          const v = s.ys[i];
          if (v == null || Number.isNaN(v)) continue;
          pts.push([xAt(i, s.ys.length), yAt(v)]);
        }
        if (!pts.length) return;
        ctx.strokeStyle = colors[si % colors.length];
        ctx.lineWidth = 2;
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
        ctx.stroke();
        ctx.fillStyle = colors[si % colors.length];
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, Math.PI * 2); ctx.fill(); });
      });

      let lx = pad.l;
      series.forEach((s, si) => {
        ctx.fillStyle = colors[si % colors.length];
        ctx.fillRect(lx, 4, 10, 10);
        ctx.fillStyle = "#c9d4ef";
        ctx.font = "12px sans-serif";
        ctx.fillText(s.name, lx + 14, 13);
        lx += ctx.measureText(s.name).width + 36;
      });

      if (labels.length) {
        ctx.fillStyle = "#9aa8c7";
        ctx.font = "10px sans-serif";
        const show = [0, Math.floor((labels.length - 1) / 2), labels.length - 1];
        show.forEach(i => {
          if (i < 0 || i >= labels.length) return;
          const t = labels[i];
          ctx.fillText(t, xAt(i, labels.length) - 18, h - 8);
        });
      }
    }

    function mediaTableHtml(items) {
      if (!items || !items.length) return '<div class="empty">暂无记录</div>';
      const rows = items.map(it => {
        const url = it.url || "";
        const cls = classificationOf(it);
        const pub = publishOf(it);
        return `<tr>
          <td>${esc(it.channel || "—")}</td>
          <td>${esc(it.title || "—")}</td>
          <td class="url">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(url)}</a>` : "—"}</td>
          <td>${classTag(cls)}</td>
          <td class="mono">${esc(fmtTime(it.first_seen))}</td>
          <td class="mono">${esc(fmtTime(it.last_seen))}</td>
          <td class="mono">${esc(fmtTime(pub))}</td>
          <td>${statusTag(it.status)}</td>
        </tr>`;
      }).join("");
      return `<table>
        <thead><tr>
          <th>渠道</th><th>标题</th><th>URL</th><th>分类</th>
          <th>首次发现</th><th>最近见到</th><th>发布时间</th><th>状态</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function organicMediaCount(snap) {
      if (snap.organic_media_count != null) return snap.organic_media_count;
      if (Array.isArray(snap.organic) && snap.organic.length) {
        return snap.organic.filter((it) => !isAnchorItem(it)).length;
      }
      return null;
    }

    function hourlyTableHtml(snaps) {
      if (!snaps || !snaps.length) return '<div class="empty">暂无小时存档</div>';
      const rows = [...snaps].reverse().map(s => {
        const g = s.github || {};
        const h = s.hf || {};
        const mediaN = organicMediaCount(s);
        const notes = (s.notes || []).join("；") || "—";
        return `<tr>
          <td class="mono">${esc(s.ts_shanghai || "—")}</td>
          <td class="mono">${fmt(g.stars)}</td>
          <td class="mono">${fmt(g.forks)}</td>
          <td class="mono">${fmt(h.likes)}</td>
          <td class="mono">${fmt(h.downloads)}</td>
          <td class="mono">${fmt(s.seeded_count)}</td>
          <td class="mono">${mediaN == null ? "—" : fmt(mediaN)}</td>
          <td>${esc(notes)}</td>
        </tr>`;
      }).join("");
      return `<table>
        <thead><tr>
          <th>上海时间</th><th>GH★</th><th>fork</th><th>HF likes</th><th>HF downloads</th>
          <th>投放数</th><th>自发媒体数</th><th>备注</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function collectMediaItems(data) {
      const byUrl = new Map();
      function add(it, cls) {
        if (!it) return;
        const url = (it.url || "").trim();
        const key = url || `id:${it.id || it.title || Math.random()}`;
        const copy = Object.assign({}, it, { _cls: cls });
        if (!copy.source_type) copy.source_type = cls;
        const prev = byUrl.get(key);
        if (!prev) {
          byUrl.set(key, copy);
          return;
        }
        // Prefer richer / newer fields
        const merged = Object.assign({}, prev, copy);
        if (prev.first_seen && (!copy.first_seen || String(prev.first_seen) < String(copy.first_seen))) {
          merged.first_seen = prev.first_seen;
        }
        if (prev.last_seen && copy.last_seen && String(prev.last_seen) > String(copy.last_seen)) {
          merged.last_seen = prev.last_seen;
        }
        // seeded wins classification
        if (prev._cls === "seeded" || prev.source_type === "seeded") {
          merged._cls = "seeded";
          merged.source_type = "seeded";
        }
        byUrl.set(key, merged);
      }

      (data.seeded || []).forEach((it) => add(it, "seeded"));
      (data.organic || []).forEach((it) => add(it, "organic"));
      const L = data.latest || {};
      (L.seeded || []).forEach((it) => add(it, "seeded"));
      (L.organic || []).forEach((it) => add(it, "organic"));
      (L.organic_new || []).forEach((it) => add(it, "organic"));

      return Array.from(byUrl.values());
    }

    function activateTab(name) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        const on = btn.dataset.tab === name;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      document.querySelectorAll(".tab-panel").forEach((panel) => {
        const on = panel.id === `tab-${name}`;
        panel.classList.toggle("active", on);
        if (on) panel.removeAttribute("hidden");
        else panel.setAttribute("hidden", "");
      });
      try { history.replaceState(null, "", `#${name}`); } catch (_) {}
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => activateTab(btn.dataset.tab));
    });

    const hash = (location.hash || "").replace(/^#/, "");
    if (hash === "media" || hash === "hourly" || hash === "board") activateTab(hash);

    if (!DATA || !DATA.latest) {
      document.getElementById("warnings").textContent = "未加载到 data.js（window.LIMIX2_DATA）。请先运行 scripts/collect_snapshot.py。";
      document.getElementById("tableMedia").innerHTML = '<div class="empty">无数据</div>';
      document.getElementById("tableAnchors").innerHTML = '<div class="empty">无数据</div>';
      document.getElementById("tableHourly").innerHTML = '<div class="empty">无数据</div>';
    } else {
      const L = DATA.latest;
      const d = L.deltas || {};
      const dg = d.github || {};
      const dh = d.hf || {};
      const g = L.github || {};
      const h = L.hf || {};
      const a = L.arxiv || {};
      const counts = DATA.counts || {};
      const allItems = collectMediaItems(DATA);
      const mediaItems = allItems.filter((it) => !isAnchorItem(it));
      const anchorItems = allItems.filter((it) => isAnchorItem(it));
      const seededN = counts.seeded != null ? counts.seeded : (DATA.seeded || []).length;
      const organicMediaN = counts.organic_media != null
        ? counts.organic_media
        : mediaItems.filter((it) => classificationOf(it) === "organic").length;

      document.getElementById("badges").innerHTML = [
        `<span class="badge">更新（上海） ${esc(L.ts_shanghai || DATA.generated_at_shanghai || "—")}</span>`,
        `<span class="badge">UTC ${esc(L.ts_utc || "—")}</span>`,
        `<span class="badge seed">投放 ${fmt(L.seeded_count != null ? L.seeded_count : seededN)}</span>`,
        `<span class="badge org">自发媒体 ${fmt(L.organic_media_count != null ? L.organic_media_count : organicMediaN)}</span>`,
        `<span class="badge">arXiv ${a.online ? "在线" : "未知"}</span>`,
        `<span class="badge">${(L.x && L.x.skipped) ? "X 已跳过" : "X"}</span>`,
        `<span class="badge warn">LimiX-2 ≠ LimiX-2M</span>`,
      ].join("");

      const warns = (DATA.warnings || []).concat(g.warning ? [g.warning] : []);
      document.getElementById("warnings").innerHTML = warns.map(w => `• ${esc(w)}`).join("<br/>");

      document.getElementById("metrics").innerHTML = [
        metricCard("GitHub Stars（整仓）", g.stars, dg.stars),
        metricCard("GitHub Forks（整仓）", g.forks, dg.forks),
        metricCard("HF Likes", h.likes, dh.likes),
        metricCard("HF Downloads", h.downloads, dh.downloads),
        metricCard("Watchers", g.watchers, dg.watchers),
        metricCard("Open Issues", g.open_issues, dg.open_issues),
        metricCard("投放条目", L.seeded_count != null ? L.seeded_count : seededN, d.seeded_count),
        metricCard("自发媒体", L.organic_media_count != null ? L.organic_media_count : organicMediaN, d.organic_count),
      ].join("");

      const snaps = DATA.history || DATA.snapshots || [];
      const xs = snaps.map(s => (s.ts_shanghai || "").slice(5));
      drawLineChart(document.getElementById("chartGh"), [
        { name: "Stars", xs, ys: snaps.map(s => (s.github || {}).stars) },
        { name: "Forks", xs, ys: snaps.map(s => (s.github || {}).forks) },
      ], ["#5b8cff", "#f5a524"]);
      drawLineChart(document.getElementById("chartHf"), [
        { name: "Likes", xs, ys: snaps.map(s => (s.hf || {}).likes) },
        { name: "Downloads", xs, ys: snaps.map(s => (s.hf || {}).downloads) },
      ], ["#7c5cff", "#2ec4b6"]);
      drawLineChart(document.getElementById("chartCounts"), [
        { name: "投放", xs, ys: snaps.map(s => s.seeded_count) },
        { name: "自发媒体", xs, ys: snaps.map(s => {
          const n = organicMediaCount(s);
          return n == null ? s.organic_count : n;
        }) },
      ], ["#7c5cff", "#2ec4b6"]);
      drawLineChart(document.getElementById("chartNew"), [
        { name: "新增自发", xs, ys: snaps.map(s => (s.organic_new || []).length) },
      ], ["#3dd68c"]);

      const notes = L.notes || [];
      document.getElementById("notes").innerHTML = notes.length
        ? notes.map(n => `<li>${esc(n)}</li>`).join("")
        : "<li>无</li>";

      document.getElementById("mediaCountHint").textContent =
        `共 ${mediaItems.length} 条（投放 ${mediaItems.filter(i => classificationOf(i)==="seeded").length} / 自发 ${mediaItems.filter(i => classificationOf(i)==="organic").length}）`;
      document.getElementById("tableMedia").innerHTML = mediaTableHtml(mediaItems);
      document.getElementById("tableAnchors").innerHTML = mediaTableHtml(anchorItems);
      document.getElementById("hourlyHint").textContent = `共 ${snaps.length} 条快照 · 新→旧`;
      document.getElementById("tableHourly").innerHTML = hourlyTableHtml(snaps);

      document.getElementById("footer").textContent =
        `数据生成于 ${DATA.generated_at_shanghai || "—"}（上海） / ${DATA.generated_at_utc || "—"} UTC · 快照数 ${snaps.length} · file:// 或 Vercel 静态托管均可`;
    }
  </script>
</body>
</html>
